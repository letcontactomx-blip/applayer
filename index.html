<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Player Debug</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
            display: none;
            /* Oculto hasta que todo cargue correctamente */
        }

        #debug-console {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #00ff00;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 9999;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #ff3333;
            font-weight: bold;
        }

        .success {
            color: #33ff33;
        }

        .info {
            color: #33ffff;
        }
    </style>
</head>

<body>

    <!-- Consola de diagnóstico en pantalla -->
    <div id="debug-console">
        <h3>=== CONSOLA DE DIAGNÓSTICO EMULATORJS ===</h3>
        <p class="info">[+] Iniciando comprobaciones del sistema...</p>
    </div>

    <!-- Contenedor del emulador -->
    <div id="game"></div>

    <script>
        const debug = document.getElementById('debug-console');

        function log(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debug.appendChild(p);
            debug.scrollTop = debug.scrollHeight;
        }

        // Capturar errores no controlados de JavaScript
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            log(`ERROR DE SCRIPT: ${msg} (Línea: ${lineNo} en ${url})`, 'error');
            return false;
        };

        // Capturar errores de red o peticiones fallidas (fetch / XHR)
        const originalFetch = window.fetch;
        window.fetch = async function (...args) {
            log(`Solicitando recurso: ${args[0]}`);
            try {
                const response = await originalFetch(...args);
                if (!response.ok) {
                    log(`ERROR DE DESCARGA HTTP ${response.status}: ${args[0]}`, 'error');
                } else {
                    log(`Cargado exitosamente: ${args[0]}`, 'success');
                }
                return response;
            } catch (err) {
                log(`FALLO DE RED AL CARGAR: ${args[0]} (${err.message})`, 'error');
                throw err;
            }
        };

        // Configuración de la ISO (alojada como asset de GitHub Release,
        // porque GitHub Pages NO sirve archivos de Git LFS: devuelve el puntero de texto)
        const RELEASE_BASE = 'https://github.com/letcontactomx-blip/applayer/releases/download/pplayer/';
        const ISO_FILE = RELEASE_BASE + 'a.bin';
        const DATA_PATH = 'data/';
        const BIOS_URL = 'data/bios/scph5501.bin';

        // Paso 1: Verificar existencia de la ISO en GitHub Pages
        log(`Verificando disponibilidad de la ISO: ${ISO_FILE}...`);

        fetch(ISO_FILE, { method: 'HEAD' })
            .then(res => {
                if (res.ok) {
                    const len = res.headers.get('content-length');
                    const size = len ? `${(len / (1024 * 1024)).toFixed(2)} MB` : 'desconocido';
                    log(`¡ISO Encontrada! Tamaño detectado: ${size}`, 'success');
                    if (len && Number(len) < 10000) {
                        log(`ADVERTENCIA: el archivo es sospechosamente pequeño (${len} bytes). ¿Es un puntero de Git LFS en vez del binario?`, 'error');
                    }
                    iniciarEmulador();
                } else if (res.status === 404) {
                    log(`ERROR 404: "${ISO_FILE}" no existe. Sube a.bin como asset de la release "pplayer".`, 'error');
                } else {
                    log(`Error HTTP al buscar la ISO. Código de respuesta: ${res.status}`, 'error');
                }
            })
            .catch(err => {
                log(`Error intentando conectar con la ISO: ${err.message}`, 'error');
            });

        function iniciarEmulador() {
            log(`Iniciando configuración de EmulatorJS...`, 'info');

            window.EJS_player = '#game';
            window.EJS_core = 'psx';
            window.EJS_gameName = 'Digimon World (USA)';
            window.EJS_color = '#0066ff';
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = DATA_PATH;   // nombre correcto de la variable (antes: EJS_pathtoEJS, inexistente)
            window.EJS_gameUrl = ISO_FILE;
            window.EJS_biosUrl = BIOS_URL;


            // Intentar cargar loader.js
            log(`Cargando script principal: ${DATA_PATH}loader.js...`);
            const script = document.createElement('script');
            script.src = `${DATA_PATH}loader.js`;

            script.onload = () => {
                log(`loader.js cargado. Descargando núcleo PS1, BIOS e ISO (~364 MB)...`, 'success');
            };

            script.onerror = () => {
                log(`ERROR CRÍTICO: No se pudo cargar "${DATA_PATH}loader.js". Revisa la carpeta data/`, 'error');
            };

            // Ocultar la consola solo cuando el emulador arranca de verdad, no al cargar loader.js
            window.EJS_ready = () => log(`Emulador listo.`, 'success');
            window.EJS_onGameStart = () => {
                log(`¡Juego iniciado!`, 'success');
                setTimeout(() => {
                    document.getElementById('game').style.display = 'block';
                    debug.style.display = 'none';
                }, 1500);
            };

            document.body.appendChild(script);
        }
    </script>
</body>

</html>
