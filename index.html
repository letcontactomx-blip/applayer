<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Player Debug</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }

        #debug-console {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #00ff00;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 9999;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Cuando EmulatorJS ya tiene su propia UI (evento "ready"): encoger la
           consola a una esquina para NO tapar la barra de progreso del emulador. */
        #debug-console.mini {
            top: auto;
            left: 8px;
            bottom: 8px;
            width: 360px;
            max-width: 60vw;
            height: 38%;
            padding: 8px 10px;
            font-size: 11px;
            border: 1px solid #0f0;
            opacity: 0.9;
        }

        .error {
            color: #ff3333;
            font-weight: bold;
        }

        .success {
            color: #33ff33;
        }

        .info {
            color: #33ffff;
        }
    </style>
</head>

<body>

    <!-- Consola de diagnóstico en pantalla -->
    <div id="debug-console">
        <h3>=== CONSOLA DE DIAGNÓSTICO EMULATORJS ===</h3>
        <p class="info">[+] Iniciando comprobaciones del sistema...</p>
    </div>

    <!-- Contenedor del emulador -->
    <div id="game"></div>

    <script>
        const debug = document.getElementById('debug-console');

        function log(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debug.appendChild(p);
            debug.scrollTop = debug.scrollHeight;
        }

        // Capturar errores no controlados de JavaScript
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            log(`ERROR DE SCRIPT: ${msg} (Línea: ${lineNo} en ${url})`, 'error');
            return false;
        };

        // Capturar errores de red o peticiones fallidas (fetch / XHR)
        const originalFetch = window.fetch;
        window.fetch = async function (...args) {
            log(`Solicitando recurso: ${args[0]}`);
            try {
                const response = await originalFetch(...args);
                if (!response.ok) {
                    log(`ERROR DE DESCARGA HTTP ${response.status}: ${args[0]}`, 'error');
                } else {
                    log(`Cargado exitosamente: ${args[0]}`, 'success');
                }
                return response;
            } catch (err) {
                log(`FALLO DE RED AL CARGAR: ${args[0]} (${err.message})`, 'error');
                throw err;
            }
        };

        // Configuración de la ISO.
        // El sitio lo publica el workflow .github/workflows/deploy-pages.yml, que hace
        // checkout con lfs:true y sube los binarios REALES como artefacto de Pages.
        // Por eso estas rutas son del mismo dominio github.io (no del repo ni de un Release).
        // Apuntamos directo al .bin (disco de 1 sola pista). EmulatorJS le genera
        // el .cue internamente; así evitamos depender de que descargue el FILE del .cue.
        const ISO_FILE = 'a.bin';
        const DATA_PATH = 'data/';
        const BIOS_URL = 'data/bios/scph5501.bin';

        // Paso 1: Verificar que el sitio publicado tenga los binarios REALES (no punteros LFS)
        log(`Verificando disponibilidad de ${ISO_FILE} y a.bin...`);

        Promise.all([
            fetch(ISO_FILE, { method: 'HEAD' }),
            fetch('a.bin', { method: 'HEAD' })
        ])
            .then(([cue, bin]) => {
                if (!cue.ok) {
                    if (cue.status === 404) {
                        log(`ERROR 404: "${ISO_FILE}" no está en el sitio. ¿Corrió el workflow deploy-pages y Settings > Pages usa "GitHub Actions" como origen?`, 'error');
                    } else {
                        log(`Error HTTP ${cue.status} al buscar ${ISO_FILE}.`, 'error');
                    }
                    return;
                }
                if (!bin.ok) {
                    log(`ERROR HTTP ${bin.status}: no se encuentra a.bin en el sitio publicado.`, 'error');
                    return;
                }
                const len = Number(bin.headers.get('content-length') || 0);
                const size = len ? `${(len / (1024 * 1024)).toFixed(2)} MB` : 'desconocido';
                log(`a.bin encontrado. Tamaño: ${size}`, len && len > 100 * 1024 * 1024 ? 'success' : 'error');
                if (len && len < 1024 * 1024) {
                    log(`ADVERTENCIA: a.bin pesa ${len} bytes: es un PUNTERO de Git LFS, no el binario. El checkout del workflow necesita lfs: true.`, 'error');
                    return;
                }
                iniciarEmulador();
            })
            .catch(err => {
                log(`Error intentando conectar con los archivos del juego: ${err.message}`, 'error');
            });

        function iniciarEmulador() {
            log(`Iniciando configuración de EmulatorJS...`, 'info');

            window.EJS_player = '#game';
            window.EJS_core = 'psx';
            window.EJS_gameName = 'Digimon World (USA)';
            window.EJS_color = '#0066ff';
            window.EJS_startOnLoaded = true;
            window.EJS_pathtodata = DATA_PATH;   // nombre correcto de la variable (antes: EJS_pathtoEJS, inexistente)
            window.EJS_gameUrl = ISO_FILE;
            window.EJS_biosUrl = BIOS_URL;


            // Intentar cargar loader.js
            log(`Cargando script principal: ${DATA_PATH}loader.js...`);
            const script = document.createElement('script');
            script.src = `${DATA_PATH}loader.js`;

            script.onload = () => {
                log(`loader.js cargado. Descargando núcleo PS1, BIOS e ISO (~364 MB)...`, 'success');
            };

            script.onerror = () => {
                log(`ERROR CRÍTICO: No se pudo cargar "${DATA_PATH}loader.js". Revisa la carpeta data/`, 'error');
            };

            // "ready" = EmulatorJS ya montó su UI y va a descargar núcleo + BIOS + ISO.
            // Encogemos la consola para que se vea la barra de progreso de EmulatorJS
            // (la descarga de la ISO son ~364 MB y puede tardar varios minutos).
            window.EJS_ready = () => {
                log(`Emulador listo. Descargando núcleo, BIOS e ISO (~364 MB)... mira la barra de progreso de EmulatorJS.`, 'success');
                debug.classList.add('mini');
            };
            window.EJS_onGameStart = () => {
                log(`¡Juego iniciado!`, 'success');
                setTimeout(() => { debug.style.display = 'none'; }, 1500);
            };

            document.body.appendChild(script);
        }
    </script>
</body>

</html>
